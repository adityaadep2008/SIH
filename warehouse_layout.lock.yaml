  - {id: NC-NC, sector: north_center, row_gap_centres_y_m: [13.5275, 15.5625, 17.5975, 19.6325, 21.6675, 23.7025, 25.7375, 27.7725], column_centres_x_m: [-2.5363, 2.5363], instance_count: 16, segment_length_m: 3.9172, clear_width_m: 1.1554, connects_to: [MC-EW-N]}
  - {id: NC-NE, sector: north_east, row_gap_centres_y_m: [13.5275, 15.5625, 17.5975, 19.6325, 21.6675, 23.7025, 25.7375, 27.7725], column_centres_x_m: [11.35, 15.67, 19.99], instance_count: 24, segment_length_m: 3.9172, clear_width_m: 1.1554, connects_to: [MC-EW-N]}
navigation:
  planner: WHCA_star
  controller: path_follower_with_orca_and_safety_supervisor
  map_topic: /map
  path_topic_template: /robot_N/path
  max_speed_mps: 6.0
  goal_checker: {arrival_tolerance_m: 0.35}
  whca_reservation_buffer_cells: 1
  whca_reservation_buffer_shape: chebyshev_3x3_same_time_slot
floor_guidance_markings:
  # Visual/map references only; no Gazebo tape-perception bridge exists yet.
  - {id: GS-MC-NS-W, colour: green, geometry: line_segment, map_coordinates_m: [[-7.5, -29.5], [-7.5, 29.5]], width_m: 0.06, purpose: main_corridor_centre_guidance}
  - {id: GS-MC-NS-E, colour: green, geometry: line_segment, map_coordinates_m: [[7.5, -29.5], [7.5, 29.5]], width_m: 0.06, purpose: main_corridor_centre_guidance}
