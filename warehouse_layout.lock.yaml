  - {id: RS-MC-EW-N, colour: red, geometry: dashed_line_segment, map_coordinates_m: [[-22.0, 10.0], [22.0, 10.0]], width_m: 0.035, purpose: low_speed_recovery_reference}
  - {id: RS-DOCK-1-BRANCH, colour: red, geometry: line_segment, map_coordinates_m: [[-5.25, -10.0], [-5.25, -29.55]], width_m: 0.08, purpose: main_recovery_to_dock_approach}
  - {id: RS-DOCK-2-BRANCH, colour: red, geometry: line_segment, map_coordinates_m: [[-3.75, -10.0], [-3.75, -29.55]], width_m: 0.08, purpose: main_recovery_to_dock_approach}
