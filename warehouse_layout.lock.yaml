# Canonical initial layout. Change this file and warehouse_clean.sdf together.
schema_version: 4
layout_locked: true
source_world: warehouse_clean.sdf
coordinate_frame: {x: right, y: forward, z: up, yaw_unit: radians}
metadata:
  warehouse_name: SIH_Warehouse_v1
  layout_version: 4.0
  author: SIH AMR Team
  map_resolution_m: 0.5
  coordinate_frame: map
  simulation_speed_multiplier: 1.0
  layout_status: locked
coordinate_system:
  canonical_frame: map
  map_origin_m: {x: -22.5, y: -30.0, z: 0.0}
  resolution_m: 0.5
  cell_formula: {cell_x: "round((map_x + 22.5) / 0.5)", cell_y: "round((map_y + 30.0) / 0.5)"}
  simulation_source: gazebo_odometry_transformed_to_map
  physical_source: dock_anchor_reset_plus_wheel_odom_imu_and_local_perception
  gazebo_pose_policy: "simulation-only ground truth; never a physical-AMR localization dependency"
  wall_boundary_policy: "grid column cx=0 represents the inner surface of the west concrete wall (x=-22.5m) and is blocked across all rows to prevent traversal through the impassable 0.55m gap behind western shelves"
  restart_policy: "publish localization invalid; move slowly along the most open safe direction; use green main-corridor tape to return to a charging-pad anchor; reset map pose only after dock confirmation"
warehouse:
  id: WH-01
  interior_bounds_2d_m: {min_x: -22.5, min_y: -30.0, max_x: 22.5, max_y: 30.0}
  dimensions_m: {x: 45.0, y: 60.0, wall_height: 6.0}
  floor_object_id: warehouse_floor
robots:
  metadata_source: {spawn_pose_file: ~/.config/sih_amr_poses.env, launch_variable_prefix: ROBOT_N_, launcher: scripts/launch_fleet_amrs.sh}
  common_model_metadata: {model: turtlebot4_lite, physical_body_dimensions_m: {x: 0.342, y: 0.339, z: 0.286}, planning_collision_radius_m: 0.35, planning_collision_diameter_m: 0.70, lidar_dimensions_m: {x: 0.071, y: 0.100, z: 0.060}, camera_dimensions_m: {x: 0.0225, y: 0.097, z: 0.030}, controller_max_speed_mps: 6.0, speed_scope: gazebo_only}
  instances:
    - {id: R1, name: robot_1, namespace: /robot_1, spawn_charging_pad_id: charging_pad_1, spawn_env: {x: ROBOT_1_X, y: ROBOT_1_Y, yaw: ROBOT_1_YAW}, spawn: {x: -5.25, y: -29.55, z: 0.05, yaw: 1.5708}, battery: {capacity_percent: 100.0, initial_level_percent: 100.0}, payload_capacity_kg: null}
    - {id: R2, name: robot_2, namespace: /robot_2, spawn_charging_pad_id: charging_pad_2, spawn_env: {x: ROBOT_2_X, y: ROBOT_2_Y, yaw: ROBOT_2_YAW}, spawn: {x: -3.75, y: -29.55, z: 0.05, yaw: 1.5708}, battery: {capacity_percent: 100.0, initial_level_percent: 100.0}, payload_capacity_kg: null}
    - {id: R3, name: robot_3, namespace: /robot_3, spawn_charging_pad_id: charging_pad_3, spawn_env: {x: ROBOT_3_X, y: ROBOT_3_Y, yaw: ROBOT_3_YAW}, spawn: {x: -2.25, y: -29.55, z: 0.05, yaw: 1.5708}, battery: {capacity_percent: 100.0, initial_level_percent: 100.0}, payload_capacity_kg: null}
    - {id: R4, name: robot_4, namespace: /robot_4, spawn_charging_pad_id: charging_pad_4, spawn_env: {x: ROBOT_4_X, y: ROBOT_4_Y, yaw: ROBOT_4_YAW}, spawn: {x: -0.75, y: -29.55, z: 0.05, yaw: 1.5708}, battery: {capacity_percent: 100.0, initial_level_percent: 100.0}, payload_capacity_kg: null}
    - {id: R5, name: robot_5, namespace: /robot_5, spawn_charging_pad_id: charging_pad_5, spawn_env: {x: ROBOT_5_X, y: ROBOT_5_Y, yaw: ROBOT_5_YAW}, spawn: {x: 0.75, y: -29.55, z: 0.05, yaw: 1.5708}, battery: {capacity_percent: 100.0, initial_level_percent: 100.0}, payload_capacity_kg: null}
    - {id: R6, name: robot_6, namespace: /robot_6, spawn_charging_pad_id: charging_pad_6, spawn_env: {x: ROBOT_6_X, y: ROBOT_6_Y, yaw: ROBOT_6_YAW}, spawn: {x: 2.25, y: -29.55, z: 0.05, yaw: 1.5708}, battery: {capacity_percent: 100.0, initial_level_percent: 100.0}, payload_capacity_kg: null}
    - {id: R7, name: robot_7, namespace: /robot_7, spawn_charging_pad_id: charging_pad_7, spawn_env: {x: ROBOT_7_X, y: ROBOT_7_Y, yaw: ROBOT_7_YAW}, spawn: {x: 3.75, y: -29.55, z: 0.05, yaw: 1.5708}, battery: {capacity_percent: 100.0, initial_level_percent: 100.0}, payload_capacity_kg: null}
    - {id: R8, name: robot_8, namespace: /robot_8, spawn_charging_pad_id: charging_pad_8, spawn_env: {x: ROBOT_8_X, y: ROBOT_8_Y, yaw: ROBOT_8_YAW}, spawn: {x: 5.25, y: -29.55, z: 0.05, yaw: 1.5708}, battery: {capacity_percent: 100.0, initial_level_percent: 100.0}, payload_capacity_kg: null}
charging_station:
  id: CH-01
  charging_pad_ids: [charging_pad_1, charging_pad_2, charging_pad_3, charging_pad_4, charging_pad_5, charging_pad_6, charging_pad_7, charging_pad_8]
  chargers: 8
  queue_capacity: 0
  charging_rate_percent_per_minute: 10.0
  location: {wall: south, min_x: -6.0, max_x: 6.0, min_y: -30.0, max_y: -29.1}
  map_anchors:
    - {id: charging_pad_1, pose: {x: -5.25, y: -29.55, yaw: 1.5708}, cell: [35, 1]}
    - {id: charging_pad_2, pose: {x: -3.75, y: -29.55, yaw: 1.5708}, cell: [38, 1]}
    - {id: charging_pad_3, pose: {x: -2.25, y: -29.55, yaw: 1.5708}, cell: [41, 1]}
    - {id: charging_pad_4, pose: {x: -0.75, y: -29.55, yaw: 1.5708}, cell: [44, 1]}
    - {id: charging_pad_5, pose: {x: 0.75, y: -29.55, yaw: 1.5708}, cell: [47, 1]}
    - {id: charging_pad_6, pose: {x: 2.25, y: -29.55, yaw: 1.5708}, cell: [50, 1]}
    - {id: charging_pad_7, pose: {x: 3.75, y: -29.55, yaw: 1.5708}, cell: [53, 1]}
    - {id: charging_pad_8, pose: {x: 5.25, y: -29.55, yaw: 1.5708}, cell: [56, 1]}
corridor_id_system:
  main_prefix: MC
  narrow_prefix: NC
  junction_prefix: J
  units: metres
  coordinate_reference: map
  narrow_instance_id_format: "NC-{sector}-R{row:02d}-C{column:02d}"
  notes: "A narrow-corridor instance is the free aisle segment between two adjacent shelf rows. R is the one-based gap index within its sector; C is the one-based shelf-column index."
main_corridors:
  - {id: MC-NS-W, name: main_north_south_west, class: main, direction: bidirectional, reservation_enabled: true, max_speed_mps: 6.0, bounds_2d_m: {min_x: -9.0, min_y: -29.75, max_x: -6.0, max_y: 29.75}, width_m: 3.0, orientation: north_south}
  - {id: MC-NS-E, name: main_north_south_east, class: main, direction: bidirectional, reservation_enabled: true, max_speed_mps: 6.0, bounds_2d_m: {min_x: 6.0, min_y: -29.75, max_x: 9.0, max_y: 29.75}, width_m: 3.0, orientation: north_south}
  - {id: MC-EW-S, name: main_east_west_south, class: main, direction: bidirectional, reservation_enabled: true, max_speed_mps: 6.0, bounds_2d_m: {min_x: -22.25, min_y: -11.5, max_x: 22.25, max_y: -8.5}, width_m: 3.0, orientation: east_west}
  - {id: MC-EW-N, name: main_east_west_north, class: main, direction: bidirectional, reservation_enabled: true, max_speed_mps: 6.0, bounds_2d_m: {min_x: -22.25, min_y: 8.5, max_x: 22.25, max_y: 11.5}, width_m: 3.0, orientation: east_west}
junctions:
  - {id: J-SW, name: junction_south_west, class: main_junction, connects: [MC-NS-W, MC-EW-S], bounds_2d_m: {min_x: -9.0, min_y: -11.5, max_x: -6.0, max_y: -8.5}, control: whca_reservation, capacity: multi_robot}
  - {id: J-SE, name: junction_south_east, class: main_junction, connects: [MC-NS-E, MC-EW-S], bounds_2d_m: {min_x: 6.0, min_y: -11.5, max_x: 9.0, max_y: -8.5}, control: whca_reservation, capacity: multi_robot}
  - {id: J-NW, name: junction_north_west, class: main_junction, connects: [MC-NS-W, MC-EW-N], bounds_2d_m: {min_x: -9.0, min_y: 8.5, max_x: -6.0, max_y: 11.5}, control: whca_reservation, capacity: multi_robot}
  - {id: J-NE, name: junction_north_east, class: main_junction, connects: [MC-NS-E, MC-EW-N], bounds_2d_m: {min_x: 6.0, min_y: 8.5, max_x: 9.0, max_y: 11.5}, control: whca_reservation, capacity: multi_robot}
  - {id: NJ-MC, name: narrow_junction_middle_centre, class: narrow_junction, connects: [NC-MC], bounds_2d_m: {min_x: -0.5, min_y: -6.5, max_x: 0.5, max_y: 6.5}, control: ricart_agrawala_mutex, capacity: one_robot, reason: two_shelf_centre_quadrant_cross_aisle}
  - {id: NJ-NC, name: narrow_junction_north_centre, class: narrow_junction, connects: [NC-NC], bounds_2d_m: {min_x: -0.5, min_y: 12.5, max_x: 0.5, max_y: 29.5}, control: ricart_agrawala_mutex, capacity: one_robot, reason: two_shelf_centre_quadrant_cross_aisle}
narrow_corridor_families:
