  - {id: DS-8, colour: red, geometry: dock_centre_strip, map_coordinates_m: [[5.25, -29.95], [5.25, -29.15]], width_m: 0.10, purpose: final_docking_alignment_reference, anchor: charging_pad_8}
  - {id: tape-narrow-aisles, colour: green, geometry: centreline_and_intersection_marker, applies_to: [narrow_corridor_families, NJ-MC, NJ-NC], purpose: narrow_aisle_following_and_intersection_identification}
docking_protocol:
  coordination: decentralized_lamport_lease
  dock_resource_policy: claim_before_approach_branch
  lease_seconds: 4.0
  final_docking: mapped_strip_geometric_alignment_at_0.15_mps_max
  confirmation: charging_pad_simulated_odometry_then_DockProtocol_CONFIRMED
  anchor_reset: localization_node_only_after_confirmation
  tape_sensor_status: not_implemented_visual_and_map_reference_only
network_and_recovery:
  approach_control: {distance_m: 2.0, speed_mps: 0.4, no_mutex_permit: stop, degraded_communication: stop}
  recovery_reverse: {distance_m: 2.0, allowed_range_m: [2.0, 4.0], speed_mps: 0.20, reject_inside_mutex_resource: true, require_lidar_clearance: true}
sensors:
  gazebo_sensor_system_scope: world
  gazebo_sensor_system_owner: warehouse_clean.sdf
  lidar: {enabled: true, ros_topic_template: /robot_N/scan, range_m: null, frequency_hz: null, noise_model: simulator_defined}
  camera: {gazebo_model_present: true, ros_bridge_enabled_in_four_amr_baseline: false, resolution: null, fps: null, domain_randomization_ready: false}
logging:
  implementation: data_collection_node
  output_format: jsonl
  robot_state: true
  task_log: true
  reservation_log: true
  navigation_log: true
  battery_log: true
  communication_log: true
  camera_log: false
  lidar_log: false
  benchmark_log: partial
benchmark:
  metrics: [makespan, throughput, average_wait, collisions, deadlocks, travel_time, energy]
  current_status: metric_schema_defined; automated benchmark runner_pending
faults:
  enabled: false
  planned: {robot_failure_probability: 0.01, lidar_failure_probability: 0.001, network_delay: true, packet_loss: true}
domain_randomization:
  enabled: false
  planned: {lighting: true, sensor_noise: true, wheel_slip: true, obstacle_spawn: true, battery_variation: true}
semantic_labels:
  shelf: {class: storage, object_id_pattern: "shelf_{sector}_{row}_{column}", zones: [south_west, south_east, middle_west, middle_center, middle_east, north_west, north_center, north_east], pickup_face: not_applicable}
  corridors: {class: traversable_lane, main_zone: main_corridor, narrow_zone: narrow_corridor}
communication:
  protocol: DDS
  health_heartbeat_hz: 2.0
  trajectory_reservation_timeout_s: 1.5
  task_consensus_lease_s: 2.0
  retry_limit: null
object_count: 216
